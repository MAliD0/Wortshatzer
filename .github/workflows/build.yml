name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Wortshatzer.slnx

      - name: Build
        run: dotnet build Wortshatzer.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests/Wortshatzer.Tests/Wortshatzer.Tests.csproj --configuration Release --no-build
